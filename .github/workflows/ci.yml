# Прогон проверок на каждое изменение.
#
# До этого 330 тестов запускались руками. Тем, что запускается руками,
# пользуются, пока помнят, и история проекта показывает, чем это
# заканчивается: два теста разошлись с кодом и месяцами не проходили
# (один ждал `DownloadTooLargeError` там, где код давно кидает
# `DocumentTooLargeError`), а сам набор нельзя было запустить на 3.8 —
# на той самой версии, где система работает.
#
# Ни одну из этих поломок нельзя увидеть, глядя на код. Их видно только
# прогоном, и прогон должен случаться сам.
#
# Матрица повторяет то, что есть в жизни, а не «свежий Python»:
#
#   3.12 с зависимостями  — контейнер, всё установлено;
#   3.12 без зависимостей — свежая копия репозитория;
#   3.8  без зависимостей — Python рабочего сервера.

name: Проверки

on:
  push:
    branches:
      - main
      - "claude/**"
  pull_request:
  workflow_dispatch:

# Новый push отменяет незаконченный прогон предыдущего: очередь на
# бесплатных исполнителях короткая, и держать в ней устаревшее незачем.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  tests:
    name: Тесты на 3.12 с зависимостями
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Установить зависимости
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement requirements.txt

      # Tesseract не ставится намеренно. Тесты проверяют решение —
      # какие аргументы уходят движку и когда запускается повтор, — а
      # не качество распознавания. Качество измеряется отдельно
      # (`python -m ops.ocr_benchmark`) и на воспроизводимых страницах.

      - name: Полный набор
        run: python -m unittest discover -s tests -p "test_*.py" --verbose

  bare:
    name: Тесты без зависимостей
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Ничего не устанавливается. Проверяется обещание, записанное в
      # роли `tests` образа: тесты, которым нужны отсутствующие
      # библиотеки, объявляют пропуск сами.
      #
      # Обещание держалось не везде: `test_ocr_engine` и
      # `test_v250_units` импортировали numpy сразу за `import unittest`
      # и на свежей копии давали ошибку загрузки. Ошибка загрузки — это
      # ненайденные тесты: вместе с семью проверками изображения молча
      # выпадали сорок проверок построителя запроса.
      - name: Набор на голой машине
        run: python -m unittest discover -s tests -p "test_*.py"

  python38:
    name: Тесты на 3.8, версии рабочего сервера
    # 3.8 нет в образе ubuntu-24.04, а сервер живёт именно на ней.
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      # Без зависимостей — часть библиотек уже не собирается под 3.8, и
      # разбираться с их разрешением здесь незачем. Проверяется другое:
      # что набор на этой версии вообще запускается. Именно это раньше
      # было сломано — три проверки пользовались `ast.unparse` (3.9) и
      # `sys.stdlib_module_names` (3.10), и на сервере падали.
      #
      # Заодно отрабатывают статические проверки: разбор всего кода
      # синтаксисом 3.8, согласие версий, контракты compose и systemd.
      - name: Набор на версии сервера
        run: python -m unittest discover -s tests -p "test_*.py"

  image:
    name: Сборка образа и разбор compose
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # Compose читает .env и без него отказывается разбирать файл.
      # Пример настроек для этого и предназначен.
      - name: Приготовить настройки из примера
        run: cp .env.production.example .env

      - name: Разобрать compose
        run: |
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.app.yml \
            config --quiet

      # Сборка ловит то, чего не видит ни один тест: несобираемый
      # Dockerfile, пропавший пакет apt, зависимость, которая больше не
      # ставится. Всё это выясняется при выкладке — то есть в худший
      # момент.
      - name: Собрать образ
        run: |
          docker build \
            --tag sochi-search-app:ci \
            --file Dockerfile \
            .

      # Роль `tests` внутри образа — это то же самое, что и на рабочей
      # машине: тот же Python, те же версии библиотек, тот же tesseract.
      - name: Прогнать набор внутри образа
        run: docker run --rm sochi-search-app:ci tests
