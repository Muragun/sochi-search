[Service]

# Прежние значения обходились дороже, чем казалось: 150 страниц, глубина 2
# и потолок пагинации в 10 страниц отсекали всё, что лежит глубже первой
# сотни свежих материалов. В индексе не было ни одного документа за
# 2020-2022 годы, за 2023 — 179, за 2024 — 7.
#
# Разовый глубокий обход теми же параметрами, но без жёстких потолков
# (4000 страниц, глубина 4, пагинация 400) нашёл сразу 20 372 новых URL.
#
# Ниже — значения для постоянного расписания: глубже прежних, но без
# нагрузки разового обхода. Параметры заданы в командной строке и
# перекрывают значения по умолчанию из `crawler_v2/discovery_config.py`,
# поэтому менять их нужно именно здесь, а не в коде.

ExecStart=
ExecStart=/usr/bin/flock --nonblock --conflict-exit-code 75 \
    /opt/sochi-search/run/discovery-worker.lock \
    /opt/sochi-search/.venv/bin/python -B -m crawler_v2.discovery_worker_v2 \
        --html-only \
        --html-max-pages 1200 \
        --html-max-depth 4 \
        --html-max-pagination-page 120 \
        --max-new 10000 \
        --report-samples 5 \
        --delay 0.15

TimeoutStartSec=45min
