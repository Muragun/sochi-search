services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.17
    container_name: sochi-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.autoconfiguration.enabled: "false"
      xpack.security.transport.ssl.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
      # Heap задаётся в .env одной строкой ES_HEAP. Правило: половина
      # памяти машины, но не больше 30 ГБ. Xms и Xmx всегда равны —
      # растущий heap вызывает паузы сборщика мусора на ровном месте.
      ES_JAVA_OPTS: "-Xms${ES_HEAP:-2g} -Xmx${ES_HEAP:-2g}"

      # Каталог для снимков индекса. Нужен при переезде на другую
      # машину: снимок делается сюда, том целиком копируется, на новой
      # машине из него восстанавливается индекс.
      # См. docs/DEPLOY.md, раздел «Перенос данных».
      path.repo: /snapshots

    # Сервер общий: рядом работают PHP-FPM, MariaDB и Node. Без предела
    # контейнер занимает heap плюс столько же вне heap и вытесняет соседей
    # в swap.
    #
    # Предел — вдвое больше heap, а не в полтора раза, как было. Полтора
    # выведены из общего правила, а замер на рабочей машине показал
    # другое: при heap 2 ГБ контейнер занимает 2,57 ГБ в покое, при 1,1 %
    # процессора и без единого запроса. Это 86 % от прежнего потолка в
    # 3 ГБ — запаса меньше полугигабайта на слияние сегментов, крупную
    # агрегацию или всплеск прямых буферов.
    #
    # Цена ошибки здесь несимметрична. Потолок великоват — сосед получит
    # чуть меньше файлового кэша. Потолок мал — ядро убивает кластер, и
    # поиск ложится целиком.
    mem_limit: ${ES_MEM_LIMIT:-4g}
    memswap_limit: ${ES_MEM_LIMIT:-4g}

    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536

    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
      - essnapshots:/snapshots

    # Готовность кластера, а не факт запуска процесса.
    #
    # Приложение ждало Elasticsearch само, изнутри контейнера, и об этом
    # ожидании compose ничего не знал: `docker compose up -d` отвечал
    # «поднято» через секунду, когда кластер ещё разворачивал шарды.
    # Скрипт развёртывания на этом основании шёл дальше и создавал индекс
    # на неготовом кластере.
    #
    # `yellow` здесь достаточно: узел один, реплики назначить некуда, и
    # `green` на одноузловом кластере не наступает никогда.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -fsS
          'http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=5s'
          || exit 1
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

    # Журнал контейнера без предела растёт, пока не кончится диск. У
    # Elasticsearch это особенно заметно: сборщик мусора и перенос шардов
    # пишут постоянно.
    logging:
      driver: json-file
      options:
        max-size: "${LOG_MAX_SIZE:-20m}"
        max-file: "${LOG_MAX_FILES:-3}"

    # Общая сеть с приложением. Без неё контейнеры оказываются в разных
    # сетях, и имя elasticsearch из ES_URL не разрешается: приложение
    # ждёт кластер, которого «не видит», хотя тот запущен.
    networks:
      - search

volumes:
  esdata:
  essnapshots:

networks:
  search:
    name: sochi-search
