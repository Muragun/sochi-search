# Приложение в контейнерах. Elasticsearch остаётся снаружи.
#
# Запуск:
#   docker compose -f docker-compose.yml -f docker-compose.app.yml up -d
#
# Переменные берутся из .env рядом с этим файлом. Обязательные:
#   ES_URL, ADMIN_USERNAME, ADMIN_PASSWORD_SHA256

# Пути внутри контейнера вынесены в отдельный якорь и подмешиваются
# ВНУТРЬ environment каждого сервиса.
#
# Так сделано намеренно: YAML-слияние `<<: *app` заменяет блок
# environment целиком, а не дополняет его. Если сервис объявляет хотя бы
# одну свою переменную, все переменные якоря пропадают, и значения
# подхватываются из .env — с путями хост-системы вместо контейнерных.
x-container-env: &container-env
  ES_URL: "${ES_URL:-http://elasticsearch:9200}"
  ES_INDEX: "${ES_INDEX:-sochi_search}"
  CRAWL_STATE_DB: /app/data/crawl_state.sqlite3
  CRAWL_DOWNLOAD_TEMP_DIR: /app/run/downloads
  CRAWL_PDF_OCR_CACHE_DIR: /app/run/pdf-cache
  CRAWL_PDF_OCR_TESSDATA: /app/ocr/tessdata
  ADMIN_TASK_DIR: /app/run/admin-tasks

# Ограничение журналов контейнера.
#
# Драйвер json-file по умолчанию не имеет предела: файл растёт, пока не
# кончится диск. Здесь это не абстракция — семь контейнеров работают
# непрерывно, разбор очереди и распознавание печатают строку прогресса
# на документ, а под всё про всё отведено 20 ГБ, на которых лежит ещё и
# индекс. Заполненный диск останавливает и Elasticsearch, и обход.
#
# Три файла по 20 МБ на контейнер — это около 420 МБ на всё
# развёртывание и примерно неделя журналов при нынешнем темпе.
x-logging: &logging
  driver: json-file
  options:
    max-size: "${LOG_MAX_SIZE:-20m}"
    max-file: "${LOG_MAX_FILES:-3}"

x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
  image: sochi-search-app:2.6.0
  restart: unless-stopped
  env_file:
    - .env
  environment:
    <<: *container-env
  volumes:
    - state:/app/data
    - runtime:/app/run
    - backups:/app/backups
  networks:
    - search
  logging: *logging
  depends_on:
    elasticsearch:
      # Ожидание переехало из entrypoint в compose не полностью: роль
      # по-прежнему ждёт кластер сама, потому что под systemd никакого
      # compose нет. Здесь условие добавляет то, чего скриптом не
      # сделать, — `docker compose up` не сообщает «поднято», пока
      # кластер не отвечает.
      condition: service_healthy

# Проверка живости, которая не подходит рабочим ролям.
#
# HEALTHCHECK объявлен в образе, а образ у всех ролей один: curl стучится
# в порт 8000, но uvicorn слушает его только в роли `api`. Остальные шесть
# контейнеров навсегда получали статус unhealthy — `docker compose ps`
# показывал развёрнутую систему как сломанную, и любой внешний присмотр,
# который смотрит на статус, оказывался бесполезен.
#
# Роли без HTTP-порта проверку отключают.
x-no-healthcheck: &no-healthcheck
  disable: true

services:

  api:
    <<: *app
    container_name: sochi-search-api
    command: ["api"]
    environment:
      <<: *container-env
      # Внутри контейнера слушаем все адреса: наружу отдаёт только
      # проброс порта ниже. Значение APP_HOST из .env здесь неприменимо —
      # там адрес хост-системы.
      APP_HOST: "0.0.0.0"
      APP_PORT: "8000"
    ports:
      # Наружу отдаём только на конкретный адрес, а не на 0.0.0.0.
      - "${API_BIND:-127.0.0.1}:${API_PORT:-18084}:8000"
    mem_limit: 512m

  worker:
    <<: *app
    container_name: sochi-search-worker
    command: ["worker"]
    healthcheck: *no-healthcheck
    mem_limit: 900m

  discovery:
    <<: *app
    container_name: sochi-search-discovery
    command: ["discovery"]
    healthcheck: *no-healthcheck
    mem_limit: 512m

  ocr-1:
    <<: *app
    container_name: sochi-search-ocr-1
    command: ["ocr"]
    environment:
      <<: *container-env
      OCR_SLOT: "1"
    healthcheck: *no-healthcheck
    mem_limit: 700m
    cpus: 1.0

  ocr-2:
    <<: *app
    container_name: sochi-search-ocr-2
    command: ["ocr"]
    environment:
      <<: *container-env
      OCR_SLOT: "2"
    healthcheck: *no-healthcheck
    mem_limit: 700m
    cpus: 1.0

  publication-date:
    <<: *app
    container_name: sochi-search-publication-date
    command: ["publication-date"]
    healthcheck: *no-healthcheck
    mem_limit: 400m


  backup:
    <<: *app
    container_name: sochi-search-backup
    command: ["backup"]
    healthcheck: *no-healthcheck
    mem_limit: 300m

volumes:
  state:
  runtime:
  backups:

networks:
  search:
    name: sochi-search
